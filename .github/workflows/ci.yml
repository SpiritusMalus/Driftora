name: CI

# The repository carries ~110 test files across two packages, and until this
# workflow existed none of them ran unless someone remembered to run them by
# hand. That is the whole point of this file: make the test suites a gate on
# every push and pull request instead of a habit.
#
# Two independent jobs, because the packages are independent: the app is Expo /
# React Native tested with jest, `server/` is plain Node tested with the built-in
# `node --test` runner. Either can fail without hiding the other's result.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch makes the previous run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (typecheck + jest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # `--ci` makes an unexpectedly-written snapshot a failure rather than a
      # silent new file; there are none today and this keeps it that way.
      - name: Tests
        run: npm test -- --ci

  server:
    name: Food server (typecheck + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # The deploy is `npm run build` on the VPS and an rsync of `dist/`. If the
      # build breaks, the next deploy breaks at the worst possible moment — on
      # the production host, with the old dist already backed up but not yet
      # replaced. Cheaper to find out here.
      - name: Build
        run: npm run build
