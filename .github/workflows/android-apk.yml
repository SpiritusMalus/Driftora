name: Android APK (preview)

# Cloud APK build that does NOT use the EAS build quota. Runs the Expo prebuild
# + Gradle pipeline on a free GitHub-hosted runner and uploads the APK as a
# build artifact. Release builds are signed with OUR key (secret
# ANDROID_KEYSTORE_BASE64 + plugins/withReleaseSigning) and the signature is
# asserted afterwards: the debug key the Expo template would otherwise use is
# world-known, cannot anchor Google Sign-In, and produces APKs that refuse to
# update an installed build. Without the secret the build still runs and warns.
#
# Trigger manually from the Actions tab (or `gh workflow run android-apk.yml`).

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Gradle variant (bundleRelease = .aab for Google Play)
        type: choice
        default: assembleRelease
        options:
          - assembleRelease
          - bundleRelease
          - assembleDebug
      arch:
        # APK-only knob. The prebuild default packs FOUR ABIs into one
        # universal APK (~135 MB); arm64-v8a alone covers effectively every
        # active Android since ~2017 and weighs ~⅓ of that. bundleRelease
        # IGNORES this on purpose: the .aab must keep all ABIs so the store
        # can slice per device — an arm64-only bundle would silently cut off
        # armv7 store users.
        description: APK CPU architectures (ignored for bundleRelease)
        type: choice
        default: arm64-v8a
        options:
          - arm64-v8a
          - armeabi-v7a,arm64-v8a
          - armeabi-v7a,arm64-v8a,x86,x86_64

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Inlined into the JS bundle at build time (already public in eas.json).
      # Override with a repo secret of the same name if it ever changes.
      EXPO_PUBLIC_FOOD_API_URL: ${{ secrets.EXPO_PUBLIC_FOOD_API_URL || 'https://food.family-pie.ru/food/parse' }}
      # Static app token paired with the server's APP_TOKEN (repo secret; PR #84).
      # Without the secret the build sends no Authorization header — same as before.
      EXPO_PUBLIC_FOOD_API_TOKEN: ${{ secrets.EXPO_PUBLIC_FOOD_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # Visible build identity for the Settings footer («Сборка: дата · sha») —
      # ends the "какая версия у меня стоит?" guessing game: every preview APK
      # shares versionCode, so Android happily replaces newer with older.
      - name: Stamp build info
        run: echo "EXPO_PUBLIC_BUILD_INFO=$(date -u +%Y-%m-%d) · ${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest ships the Android SDK; this also wires ANDROID_HOME and
      # accepts licenses so prebuild/Gradle can resolve build-tools.
      - uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      # The release key, restored from a secret. Without it the build still
      # works — plugins/withReleaseSigning is a no-op and the template's debug
      # signing stays — so a fork without the secret is not broken, it just
      # produces an APK that cannot update an installed one.
      - name: Restore release keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set — this APK will be signed with the debug key and will NOT update an installed build."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Expo prebuild (android)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: npx expo prebuild --platform android --no-install

      - name: Build (${{ inputs.variant }})
        working-directory: android
        run: |
          chmod +x ./gradlew
          # OOM guard (run 28796671425 died on mergeDexRelease +
          # mergeReleaseNativeDebugMetadata with "Java heap space"): the Expo
          # template pins the Gradle JVM at 2 GB, which is borderline when the
          # heavy release tasks overlap. android/ is prebuild-generated, so the
          # heap can only be raised here; a later duplicate key in
          # gradle.properties wins. --max-workers caps how many memory-hungry
          # tasks run at once.
          printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\n' >> gradle.properties
          # ABI trim for APKs only (see the arch input): the store bundle keeps
          # every ABI, a sideload APK ships just what real phones run.
          if [ "${{ inputs.variant }}" = "bundleRelease" ]; then
            ./gradlew ${{ inputs.variant }} --no-daemon --max-workers=2
          else
            ./gradlew ${{ inputs.variant }} --no-daemon --max-workers=2 \
              -PreactNativeArchitectures="${{ inputs.arch || 'arm64-v8a' }}"
          fi

      # bundleRelease emits the .aab Google Play requires (Play does not accept
      # APKs); the same release key signs it and becomes the "upload key" once
      # Play App Signing is enrolled on first upload. APK variants stay for
      # direct installs and RuStore.
      - name: Locate artifact
        id: apk
        run: |
          if [ "${{ inputs.variant }}" = "bundleRelease" ]; then
            path="$(find android/app/build/outputs/bundle -name '*.aab' | head -1)"
          else
            path="$(find android/app/build/outputs/apk -name '*.apk' | head -1)"
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "Built: $path"

      # A green build proves nothing about WHICH key signed it, and signing with
      # the wrong one is invisible until an install refuses to update — or until
      # Google Sign-In rejects the app for an unknown fingerprint. So assert the
      # fingerprint, and fail the run if it is not ours.
      - name: Verify APK signature
        if: steps.signing.outputs.signed == 'true'
        env:
          EXPECTED_SHA1: ${{ vars.ANDROID_SIGNING_SHA1 }}
        run: |
          set -euo pipefail
          # apksigner does not read app bundles — an .aab carries a jar-style
          # signature, so its certificate is read with keytool instead.
          if [[ "${{ steps.apk.outputs.path }}" == *.aab ]]; then
            actual="$(keytool -printcert -jarfile "${{ steps.apk.outputs.path }}" \
              | grep -i 'SHA1:' | head -1 | sed 's/.*SHA1: *//' | tr -d ': ' | tr 'a-f' 'A-F')"
          else
            apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)"
            actual="$("$apksigner" verify --print-certs "${{ steps.apk.outputs.path }}" \
              | grep -i 'SHA-1 digest' | head -1 | sed 's/.*: *//' | tr -d ':' | tr 'a-f' 'A-F')"
          fi
          echo "signer SHA-1: $actual"
          if [ -z "${EXPECTED_SHA1:-}" ]; then
            echo "::warning::ANDROID_SIGNING_SHA1 variable is not set — signature not compared."
            exit 0
          fi
          expected="$(printf '%s' "$EXPECTED_SHA1" | tr -d ':' | tr 'a-f' 'A-F')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::APK is signed with $actual, expected $expected — Google Sign-In and in-place updates will both break."
            exit 1
          fi
          echo "signature matches the registered release key"

      - uses: actions/upload-artifact@v7
        with:
          name: driftora-android-${{ inputs.variant == 'bundleRelease' && 'aab' || 'apk' }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
