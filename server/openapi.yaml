openapi: 3.1.0

# The contract between two codebases in two languages: the Expo/TypeScript app
# (lib/core/services/foodParser.ts and friends) and this Node/Express service.
# Nothing enforced it before — the shapes were kept in agreement by hand, in two
# repositories' worth of interfaces, and a field renamed on one side would only
# surface as a silently missing value on a user's screen.
#
# `test/openapiContract.test.ts` asserts that every route registered by
# `createApp()` appears here and vice versa, so this file cannot quietly rot.
# It documents SHAPES; the prose about what the numbers mean lives in
# docs/nutrition-science.md.

info:
  title: Driftora food-parse
  version: '1.0.0'
  description: |
    Turns free text, photos and voice into structured nutrition and workouts.

    Stateless: nothing is persisted. Photos and audio clips live in memory for
    the duration of the request and are never written to disk (privacy §2).
    Request content is never logged — only aggregate counters.

    Energy numbers are estimates. Where the model reads a printed nutrition
    panel it is transcribing ground truth; everywhere else the client shows the
    result with «≈».

servers:
  - url: https://food.family-pie.ru
    description: production (single VPS behind Caddy)
  - url: http://127.0.0.1:8787
    description: local

security:
  - bearerAuth: []

tags:
  - name: food
  - name: workout
  - name: ops

paths:
  /health:
    get:
      tags: [ops]
      summary: Liveness probe
      description: |
        Public and never rate-limited, on purpose: the external uptime monitor
        has no token, and a probe that can be throttled cannot tell "throttled"
        from "dead". This is also the container HEALTHCHECK.
      security: []
      responses:
        '200':
          description: The process is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }

  /metrics:
    get:
      tags: [ops]
      summary: Aggregate, content-free counters
      description: |
        Counts and latencies only — never request content. Resets on restart, so
        read `uptime_s` alongside anything else. Thresholds in docs/operations.md.
      responses:
        '200':
          description: Snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Metrics' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /billing/register:
    post:
      tags: [billing]
      summary: Bind a store purchase to this install
      description: |
        Verifies the purchase with the store and, if it is real, raises this
        install's daily AI cap to the paid tier. `X-Install-Id` is required —
        it is what the entitlement is bound to.

        The client calls this after a purchase AND on every launch: re-registering
        is how a subscription follows the user onto a new phone (the install id
        changes, the store account's purchase does not), and how a refund ends
        access here — the service stores only a hash of the token and cannot
        re-ask the store on its own.

        `503 store_unreachable` does NOT mean the purchase is bad; retry later
        and do not tell the user their payment failed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purchaseToken, productId]
              properties:
                purchaseToken: { type: string }
                productId:
                  type: string
                  description: |
                    A hint only. The stored tier comes from the product the STORE
                    reports for this token, never from this field.
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema:
                type: object
                required: [active, expires_at, state]
                properties:
                  active: { type: boolean }
                  expires_at: { type: integer, description: Epoch ms; 0 when the store did not say. }
                  state: { type: string, enum: [active, grace, paused, expired, revoked] }
        '400': { description: Missing install id or malformed body }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { description: The store does not recognize this purchase }
        '503': { description: Billing is not configured here, or the store could not be reached }

  /billing/status:
    get:
      tags: [billing]
      summary: This install's current entitlement
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                type: object
                required: [billing_enabled, active, expires_at, state]
                properties:
                  billing_enabled:
                    type: boolean
                    description: False on a deployment that sells nothing — everyone gets the free tier.
                  active: { type: boolean }
                  expires_at: { type: integer }
                  state: { type: string, enum: [active, grace, paused, expired, revoked, none] }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /billing/yookassa/webhook:
    post:
      tags: [billing]
      summary: ЮKassa payment notification
      description: |
        Called by ЮKassa, not by the app — so it is NOT token-authenticated.
        Authentication is the source-IP allowlist ЮKassa prescribes, and the
        handler re-reads the payment through the ЮKassa API rather than trusting
        the notification body (anyone able to spoof an allowed address could
        otherwise mint subscriptions by POSTing `payment.succeeded`).

        Status codes are a protocol: 200 stops redelivery, anything else makes
        ЮKassa retry for up to 24 hours. A payment we could not verify therefore
        answers 500 on purpose.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type: { type: string, example: notification }
                event: { type: string, example: payment.succeeded }
                object:
                  type: object
                  properties:
                    id: { type: string }
      responses:
        '200': { description: Processed, or understood and intentionally ignored }
        '400': { description: Notification without an object id }
        '403': { description: Not a ЮKassa source address }
        '500': { description: Could not verify the payment — ЮKassa should retry }
        '503': { description: Direct sales are not configured on this deployment }

  /billing/checkout:
    post:
      tags: [billing]
      summary: Create a ЮKassa payment and get where to send the payer
      description: |
        The outbound half of direct sales: the webhook above can only settle a
        payment that already exists, and a payment link pasted from the ЮKassa
        dashboard cannot carry `metadata.plan` or `metadata.license_key` — so it
        can sell neither a yearly plan nor a renewal of an existing licence.

        Not token-authenticated: the caller is `/billing/pay`, a web page, which
        has no app token. Creating a payment moves no money and commits nobody;
        the per-IP daily cap bounds the abandoned-payment noise.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plan: { type: string, enum: [monthly, yearly], default: monthly }
                email:
                  type: string
                  description: Buyer's email. Required when the shop issues fiscal receipts (BILLING_RECEIPT=1).
                license_key:
                  type: string
                  description: Renewal — must be a key we issued, else 404. Absent on a first purchase.
                return_url:
                  type: string
                  description: |
                    Where to send the payer afterwards. Allowed only for origins in
                    BILLING_WEB_ORIGINS (our own site) — compared as a parsed origin, never
                    as a prefix, so a payment link cannot become an open redirect wearing
                    our domain. Omitted by the app, which gets the service's own return page.
      responses:
        '200':
          description: Payment created
          content:
            application/json:
              schema:
                type: object
                required: [payment_id, confirmation_url, plan, amount]
                properties:
                  payment_id: { type: string }
                  confirmation_url: { type: string, description: Send the payer here. }
                  plan: { type: string, example: monthly }
                  amount: { type: string, example: '199.00' }
        '400': { description: Unknown plan, a missing/invalid email when receipts are on, or a return_url that is not ours }
        '404': { description: license_key is not a licence we issued }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502': { description: ЮKassa would not create the payment — retry }
        '503': { description: Direct sales are not configured on this deployment }

  /billing/plans:
    get:
      tags: [billing]
      summary: What is on sale, and for how much
      description: |
        Read by the app's native subscription screen. The price lives here rather
        than in the build for the same reason the quota caps do: a number baked
        into an APK can only be corrected by a store release.
      responses:
        '200':
          description: Price list
          content:
            application/json:
              schema:
                type: object
                required: [enabled, receipt_required, currency, plans]
                properties:
                  enabled: { type: boolean, description: False when this deployment sells nothing. }
                  receipt_required: { type: boolean, description: True → the buyer's email is mandatory. }
                  currency: { type: string, example: RUB }
                  plans:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, example: monthly }
                        days: { type: integer, example: 30 }
                        amount: { type: string, example: '199.00' }
                        description: { type: string }

  /billing/pay:
    get:
      tags: [billing]
      summary: Redirect to the purchase page
      description: |
        The stable address of "where you buy". The page itself lives on the site
        (`BILLING_SALES_URL`, default `https://family-pie.ru/driftora/subscription`)
        — keeping a copy here meant a second home for the price, the refund rules
        and the seller's details, which is the kind of duplication that goes stale
        in whichever copy nobody is looking at.

        302 rather than 301: a permanent redirect is cached by browsers forever,
        and the target is a deployment detail that may move again.
      responses:
        '302': { description: Redirect to the purchase page }

  /billing/done:
    get:
      tags: [billing]
      summary: Return page after payment (HTML)
      description: |
        Where ЮKassa returns the payer. Polls `/billing/license` and shows the
        key — arriving here means the browser is done, not that the notification
        has landed. Served unconditionally, so someone returning from an older
        payment is never told a licence they own does not exist.
      parameters:
        - in: query
          name: payment_id
          required: false
          schema: { type: string }
          description: Optional — the page also reads the id it stored before redirecting.
      responses:
        '200': { description: HTML, content: { text/html: { schema: { type: string } } } }

  /billing/license:
    get:
      tags: [billing]
      summary: Collect the licence key for a settled payment
      description: |
        Used by the checkout page after ЮKassa redirects the buyer back. Not
        token-authenticated (the web page has no app token); the payment id is an
        unguessable ЮKassa uuid known only to the buyer, and the route is capped
        per IP per day.

        `404 license_not_ready` is also the honest answer while the notification
        is still in flight — poll, do not conclude the payment failed.
      parameters:
        - in: query
          name: payment_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Issued
          content:
            application/json:
              schema:
                type: object
                required: [key, plan, paid_until]
                properties:
                  key: { type: string, example: ABCD-EFGH-JKLM-NPQR }
                  plan: { type: string, example: monthly }
                  paid_until: { type: integer, description: Epoch ms. }
        '400': { description: Missing payment_id }
        '404': { description: No licence for this payment yet }
        '429': { $ref: '#/components/responses/RateLimited' }

  /food/parse:
    post:
      tags: [food]
      summary: Free text → a meal draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 1000
                  example: омлет из трёх яиц и кофе с молоком
                region: { $ref: '#/components/schemas/Region' }
      responses:
        '200':
          description: |
            A draft. An unrecognised input yields `items: []` with zero totals —
            that is a successful request reporting nothing, never a 4xx.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MealDraft' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/LlmUnavailable' }

  /food/parse-photo:
    post:
      tags: [food]
      summary: Photo of food or a nutrition label → a meal draft
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: ≤ 8 MB. The client downscales the long side to ≤ 1024 px first.
                region: { $ref: '#/components/schemas/Region' }
      responses:
        '200':
          description: A draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MealDraft' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/LlmUnavailable' }

  /food/parse-audio:
    post:
      tags: [food]
      summary: Spoken meal → a meal draft
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio: { type: string, format: binary, description: ≤ 8 MB }
                region: { $ref: '#/components/schemas/Region' }
      responses:
        '200':
          description: A draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MealDraft' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/LlmUnavailable' }

  /food/search:
    post:
      tags: [food]
      summary: Ranked database candidates for a query
      description: |
        The manual "find it yourself" picker. With `ai: true` the caller has
        consented to a cross-border model call, and one AI-estimated card is
        appended after the database rows — both are returned so the user picks,
        each carrying its own source tag.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, minLength: 1, maxLength: 1000 }
                region: { $ref: '#/components/schemas/Region' }
                ai:
                  type: boolean
                  default: false
                  description: Requires the user's AI consent. Off ⇒ database rows only.
      responses:
        '200':
          description: Candidates, best first
          content:
            application/json:
              schema:
                type: object
                required: [candidates]
                properties:
                  candidates:
                    type: array
                    items: { $ref: '#/components/schemas/NutritionAlternative' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /workout/parse:
    post:
      tags: [workout]
      summary: Free text → activities
      description: |
        The model maps text to structured activities only. Calories are computed
        on the CLIENT from the user's weight and resting rate, so no energy
        number for this user ever crosses the wire.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 1000, example: полчаса бегал и 20 приседаний }
      responses:
        '200':
          description: Activities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParsedWorkouts' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/LlmUnavailable' }

  /workout/parse-audio:
    post:
      tags: [workout]
      summary: Spoken workout → activities
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio: { type: string, format: binary, description: ≤ 8 MB }
      responses:
        '200':
          description: Activities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParsedWorkouts' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/LlmUnavailable' }

  /workout/parse-photo:
    post:
      tags: [workout]
      summary: Screenshot of a tracker → activities plus the tracker's own totals
      description: |
        When the tracker printed a burn, `device_kcal` carries it and the client
        logs THAT number instead of re-deriving one — the device measured it.
        An implausible value is dropped while the activities survive.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary, description: ≤ 8 MB }
      responses:
        '200':
          description: Activities and, when legible, the tracker's totals
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParsedWorkoutPhoto' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/LlmUnavailable' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        `APP_TOKEN`, compared in constant time. When the variable is unset the
        check is a no-op and every route is public — acceptable only behind a
        network boundary.

  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: unauthorized, message: Missing or invalid access token. } }
    BadInput:
      description: Empty or over-long input (`empty_input`, `input_too_long`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooLarge:
      description: Upload above the 8 MB cap (`input_too_large`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: |
        Burst or daily cap hit, or the shared AI quota is exhausted. The client
        degrades to manual entry rather than showing an error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: '`internal_error`. Never carries a stack trace or the request content.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    LlmUnavailable:
      description: |
        `llm_unavailable` — the model provider is unreachable or out of credit.
        Fails closed: no fabricated numbers. Note `/health` stays green.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Region:
      type: string
      enum: [RU, US]
      description: Selects the nutrition-database chain. Defaults to `DEFAULT_REGION`.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                [
                  empty_input,
                  input_too_long,
                  input_too_large,
                  unauthorized,
                  internal_error,
                  llm_unavailable,
                  billing_unavailable,
                  install_id_required,
                  invalid_purchase_body,
                  invalid_purchase,
                  store_unreachable,
                  license_not_ready,
                  unknown_plan,
                  email_required,
                  invalid_email,
                  unknown_license,
                  invalid_return_url,
                ]
            message: { type: string }

    NutritionSource:
      type: string
      description: |
        Where the per-100 g numbers came from. `estimate` is a database MISS
        whose numbers the client hides until the user fills them in; `ai_estimate`
        is the model's own guess. Both are shown to the user as such — the
        provenance is part of the answer, not metadata.
      enum: [usda, skurikhin, openfoodfacts, apininjas, fatsecret, label, ai_estimate, estimate]

    NutrientValues:
      type: object
      description: Energy and macros; micronutrients only where a source measured them.
      properties:
        kcal: { type: number }
        prot: { type: number }
        fat: { type: number }
        carb: { type: number }
        fiber: { type: number, description: 'grams; 2 kcal/g, counted once' }
        sugar: { type: number }
        satFat: { type: number }
        minerals:
          type: object
          description: mg per 100 g. Any subset — a key exists only when measured, never zero-filled.
          properties:
            na: { type: number }
            k: { type: number }
            ca: { type: number }
            mg: { type: number }
            fe: { type: number }
            zn: { type: number }
        vitamins:
          type: object
          description: µg for a/d/b9/b12, mg for e/c/b1/b2/b6. Any subset.
          properties:
            a: { type: number }
            d: { type: number }
            e: { type: number }
            c: { type: number }
            b1: { type: number }
            b2: { type: number }
            b6: { type: number }
            b9: { type: number }
            b12: { type: number }

    Per100:
      allOf:
        - $ref: '#/components/schemas/NutrientValues'
        - type: object
          required: [source]
          properties:
            source: { $ref: '#/components/schemas/NutritionSource' }

    NutritionAlternative:
      type: object
      description: Another ranked database row for the same item.
      required: [name, per100]
      properties:
        name: { type: string }
        per100: { $ref: '#/components/schemas/Per100' }

    NutritionItem:
      type: object
      required: [name_ru, name_en, grams, grams_source, confidence, per100, scaled, approximate]
      properties:
        name_ru: { type: string }
        name_en: { type: string }
        grams: { type: number }
        grams_source:
          type: string
          enum: [estimated, confirmed]
          description: |
            `estimated` = the weight was assumed. Portion mass, not composition,
            is the largest error source in the whole chain, so the client says so
            in the open.
        confidence: { type: number, minimum: 0, maximum: 1 }
        per100: { $ref: '#/components/schemas/Per100' }
        scaled:
          allOf: [{ $ref: '#/components/schemas/NutrientValues' }]
          description: per100 × grams / 100
        approximate: { type: boolean }
        matched_name:
          type: string
          description: |
            The display name of the database row the numbers actually came from
            («картошка» → «картофель варёный»). Absent on a full miss. The user
            must see this: a plausible number from the wrong row is the failure
            mode that looks like success.
        prepared:
          type: boolean
          description: Already-prepared dish; the client skips the cooking adjustment to avoid double-counting.
        alternatives:
          type: array
          items: { $ref: '#/components/schemas/NutritionAlternative' }
        dry_basis_suspected:
          type: boolean
          description: The row looks like a dry-product label while the weight is probably the cooked dish (~3× overcount).

    MealDraft:
      type: object
      required: [region, items, totals, portion_state, approximate, flags]
      properties:
        region: { $ref: '#/components/schemas/Region' }
        heard:
          type: string
          description: |
            Verbatim transcript of the speech — `/food/parse-audio` ONLY, absent
            everywhere else. On that route the speech is understood server-side,
            so without this a parse that recognised no food left the caller with
            nothing of the user's own to show.

            It is a record of what was said, NOT nutrition data: it never becomes
            a food name and never feeds a number. Absent when the model returned
            nothing usable, or when the transcript was implausibly long (a decode
            loop rather than speech).
        items:
          type: array
          items: { $ref: '#/components/schemas/NutritionItem' }
        totals: { $ref: '#/components/schemas/NutrientValues' }
        portion_state: { type: string, enum: [estimated, confirmed] }
        approximate: { type: boolean }
        flags:
          type: object
          required: [has_estimate, has_ai_estimate, low_confidence]
          properties:
            has_estimate: { type: boolean }
            has_ai_estimate: { type: boolean }
            low_confidence: { type: boolean }

    ParsedWorkout:
      type: object
      required: [type, name_ru, minutes, confidence]
      properties:
        type: { type: string }
        name_ru: { type: string }
        minutes: { type: number }
        speed_kmh: { type: number }
        met: { type: number, description: 'Compendium 2024 metabolic equivalent' }
        sets: { type: number }
        intensity: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }

    ParsedWorkouts:
      type: object
      required: [workouts]
      properties:
        workouts:
          type: array
          items: { $ref: '#/components/schemas/ParsedWorkout' }

    ParsedWorkoutPhoto:
      allOf:
        - $ref: '#/components/schemas/ParsedWorkouts'
        - type: object
          properties:
            device_kcal: { type: number, description: Total active calories the tracker itself printed }
            device_minutes: { type: number }

    Metrics:
      type: object
      description: Aggregate only. See docs/operations.md for the SLO thresholds.
      properties:
        uptime_s: { type: integer }
        requests:
          type: object
          description: |
            SUCCESSFUL parses only — read together with `failures`, never alone.
          properties:
            text: { type: integer }
            photo: { type: integer }
            audio: { type: integer }
        failures:
          type: object
          description: |
            Requests that produced no draft at all, by route. Added 2026-08-12:
            failures never reached `recordParse`, so they were absent from every
            counter — which hid a defect failing roughly two thirds of voice
            notes while `/metrics` showed only healthy parses.
          properties:
            text: { type: integer }
            photo: { type: integer }
            audio: { type: integer }
        failures_by_reason:
          type: object
          properties:
            llm_unavailable: { type: integer }
            internal_error: { type: integer }
        by_region:
          type: object
          properties:
            RU: { type: integer }
            US: { type: integer }
        empty: { type: integer, description: Parses that returned no items — the «не распозналось» counter }
        low_confidence: { type: integer }
        escalations: { type: integer, description: Retries on the pricier model — the cost signal }
        truncation_retries: { type: integer }
        label_cache_hits: { type: integer }
        hedges: { type: integer }
        sources:
          type: object
          additionalProperties: { type: integer }
        latency_ms:
          type: object
          additionalProperties:
            type: object
            properties:
              avg: { type: integer }
              count: { type: integer }
        stage_ms:
          type: object
          description: Per-stage timings inside one parse (identify_* / resolve / translate).
          additionalProperties:
            type: object
            properties:
              avg: { type: integer }
              count: { type: integer }
        ai_quota:
          type: object
          additionalProperties: true
